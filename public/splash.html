<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MotionCraft</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash" aria-label="MotionCraft is starting">
      <img class="art" src="splash.jpg" alt="" />
      <div class="progress" role="progressbar" aria-label="Starting MotionCraft" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="track"><div class="fill" id="fill"></div></div>
        <p class="status" id="status">Starting…</p>
      </div>
      <footer class="foot">
        <a class="docs" href="mc-open://docs">Documentation</a>
        <span class="version" id="version"></span>
      </footer>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
