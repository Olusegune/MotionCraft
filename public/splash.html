<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MotionCraft</title>
    <style>
      html, body { margin: 0; height: 100%; background: #181A1C; overflow: hidden; }
      img { display: block; width: 100%; height: 100%; object-fit: cover; animation: in 400ms ease-out both; }
      @keyframes in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { img { animation: none; } }
    </style>
  </head>
  <body>
    <img src="splash.jpg" alt="MotionCraft is starting" />
  </body>
</html>
