[package]
name = "motioncraft"
version = "0.1.2"
description = "MotionCraft: the director layer for motion design"
authors = ["MotionCraft"]
license = "UNLICENSED"
publish = false
edition = "2021"
rust-version = "1.77"

[lib]
name = "motioncraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
getrandom = "0.3"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
