name: QuickPath

# QuickPath lives in quickpath/ on the claude/quick-path branch. It is separate from the main MotionCraft app and its CI.
on:
  push:
    branches: [claude/quick-path]
    paths: ["quickpath/**", ".github/workflows/quickpath.yml"]
  pull_request:
    paths: ["quickpath/**", ".github/workflows/quickpath.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quickpath } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: quickpath/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p . || true   # types are advisory: the tests below are the gate
      - name: Tests (the real-EffectCraft tests report as skipped here, not passed)
        run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, command: "npm run dist", app: "release/win-unpacked/QuickPath.exe" }
          - { os: macos-latest, name: macos, command: "npm run bundle && npx electron-builder --mac dmg --arm64 --x64 --publish never", app: "release/mac-arm64/QuickPath.app/Contents/MacOS/QuickPath" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: quickpath } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: quickpath/package-lock.json }
      - run: npm ci
      # Signing happens only when the secrets exist (see quickpath/docs/SIGNING.md); without them the build is unsigned, as before.
      - name: Build
        shell: bash
        run: |
          # GitHub passes a missing secret as an empty string, which the builder would read as a file name: unset what is empty, and build unsigned when there is no certificate
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do if [ -z "${!v}" ]; then unset "$v"; fi; done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "No signing certificate: building unsigned"; fi
          ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # (The app ends itself after 60 seconds with a failure if it gets no answer, so no outside timer is needed: macOS has no `timeout`.) Prove the packaged app really starts on this system: it loads its own page, checks the menu, the guides and the server, and exits 0.
      - name: Smoke test the packaged app
        shell: bash
        run: |
          set -o pipefail
          QUICKPATH_SMOKE=1 "${{ matrix.app }}" 2>&1 | tee smoke.log
          grep -q '"ok":true' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPath-${{ matrix.name }}
          path: |
            quickpath/release/*.exe
            quickpath/release/*.zip
            quickpath/release/*.dmg
          if-no-files-found: error
