name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Engine tests (mock adapter)
        working-directory: engine
        run: |
          pip install pydantic pillow pytest
          python -m pytest -q
      - name: Python dependency audit
        working-directory: engine
        run: |
          pip install pip-audit
          pip-audit .
      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cd src-tauri && cargo audit

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "", name: windows-x64, targets: "" }
          - { os: macos-latest, args: "--target aarch64-apple-darwin", name: macos-arm64, targets: "aarch64-apple-darwin" }
          - { os: macos-15-intel, args: "--target x86_64-apple-darwin", name: macos-x64, targets: "x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build the engine helper (PyInstaller)
        run: |
          python -m pip install pyinstaller pydantic pillow
          python scripts/build_sidecar.py
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build ${{ matrix.args }}
      - name: Build signed installers and update packages (release tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      - name: Portable zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/MotionCraft | Out-Null
          Copy-Item src-tauri/target/release/motioncraft.exe portable/MotionCraft/MotionCraft.exe
          Copy-Item src-tauri/binaries/motioncraft-engine-*.exe portable/MotionCraft/motioncraft-engine.exe
          Copy-Item -Recurse THIRD_PARTY_NOTICES portable/MotionCraft/
          Compress-Archive -Path portable/MotionCraft -DestinationPath "MotionCraft_portable_windows-x64.zip"
      - name: Smoke test the built app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Starts the portable build and calls its engine commands from inside its own web view. Not blocking yet: make it required
        # once it has been seen green on a GitHub runner.
        continue-on-error: true
        run: |
          python -m pip install websockets
          python scripts/smoke_app.py "portable/MotionCraft/MotionCraft.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MotionCraft-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
            MotionCraft_portable_windows-x64.zip

  release:
    # Only for version tags. Publishes the installers and the signed updater manifest that installed apps check.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Assemble release files and latest.json
        run: python scripts/make_latest_json.py artifacts "${{ github.ref_name }}" release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artifacts/MotionCraft-windows-x64/src-tauri/target/release/bundle/msi/*.msi release/ || true
          cp artifacts/MotionCraft-windows-x64/MotionCraft_portable_windows-x64.zip release/ || true
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          rm -f release/*.sig
          gh release create "${{ github.ref_name }}" release/* --title "MotionCraft ${{ github.ref_name }}" --generate-notes
