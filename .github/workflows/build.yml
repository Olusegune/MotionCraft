name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --audit-level=high
      - run: npm run build

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            name: windows-x64
          - os: macos-latest
            args: "--target universal-apple-darwin"
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
      - name: Portable zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/MotionCraft | Out-Null
          Copy-Item src-tauri/target/release/motioncraft.exe portable/MotionCraft/MotionCraft.exe
          Copy-Item -Recurse THIRD_PARTY_NOTICES portable/MotionCraft/
          Compress-Archive -Path portable/MotionCraft -DestinationPath "MotionCraft_portable_windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MotionCraft-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            MotionCraft_portable_windows-x64.zip
